<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>InsCleaner Helper</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #09090f;
      color: #f3f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #833ab4, #e1306c, #f77737);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }
    h1 {
      font-size: 15px;
      margin: 0;
    }
    p {
      font-size: 12px;
      color: #989cb2;
      margin: 6px 0 12px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #131320;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #833ab4, #e1306c, #f77737);
      color: #fff;
    }
    .btn-ghost {
      background: #1b1b2d;
      color: #f3f4f8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #status {
      font-size: 12px;
      min-height: 18px;
      color: #4ade80;
    }
    #status.err {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">IC</div>
    <div>
      <h1>InsCleaner Helper</h1>
    </div>
  </div>
  <p>Açık Instagram oturumundan <code>sessionid</code> çerezini güvenle okuyup InsCleaner paneline aktarır.</p>

  <label for="server-url">InsCleaner Sunucu Adresi</label>
  <input id="server-url" type="text" value="http://127.0.0.1:8000" />

  <button id="btn-open" class="btn-primary">Session ID ile Paneli Aç</button>
  <button id="btn-copy" class="btn-ghost">Sadece Session ID Kopyala</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
